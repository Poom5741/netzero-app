<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NetZeroCarbon</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #06c755 0%, #00a854 100%);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-icon { font-size: 24px; }
    .header-title { font-size: 16px; font-weight: 600; }
    .header-subtitle { font-size: 11px; opacity: 0.85; }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message.bot {
      align-self: flex-start;
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .message.user {
      align-self: flex-end;
      background: #06c755;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.system {
      align-self: center;
      background: rgba(0,0,0,0.06);
      color: #666;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 12px;
    }
    .typing {
      align-self: flex-start;
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: white;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .typing span {
      width: 8px;
      height: 8px;
      background: #ccc;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .input-area {
      background: white;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
    }
    .input-area input:focus { border-color: #06c755; }
    .input-area button {
      background: #06c755;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .input-area button:disabled { background: #ccc; }
    .quick-actions {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .quick-actions button {
      white-space: nowrap;
      background: white;
      border: 1px solid #06c755;
      color: #06c755;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .quick-actions button:active { background: #e8f5e9; }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>กำลังเชื่อมต่อ...</div>
  </div>

  <div id="app" style="display:none; flex-direction:column; height:100vh;">
    <div class="header">
      <div class="header-icon">🌱</div>
      <div>
        <div class="header-title">NetZeroCarbon</div>
        <div class="header-subtitle">ผู้ช่วยเกษตรกรโครงการ AWD</div>
      </div>
    </div>

    <div class="chat-container" id="chat"></div>

    <div class="quick-actions" id="quickActions">
      <button onclick="sendQuick('สวัสดี')">👋 สวัสดี</button>
      <button onclick="sendQuick('ช่วย')">❓ ช่วย</button>
      <button onclick="sendQuick('ถ่ายรูป')">📸 ถ่ายรูป</button>
      <button onclick="sendQuick('เลือกแปลง')">🌾 เลือกแปลง</button>
    </div>

    <div class="input-area">
      <input type="text" id="input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
      <button id="sendBtn" onclick="send()">➤</button>
    </div>
  </div>

  <script>
    let liffUserId = null;
    let liffToken = null;
    const API_BASE = window.location.origin;

    // Initialize LIFF
    async function initLiff() {
      try {
        const liffId = window.LIFF_ID || '';
        if (liffId) {
          await liff.init({ liffId });
          liffUserId = liff.getProfile().userId;
          liffToken = liff.getAccessToken();
        } else {
          // Demo mode — no LIFF
          liffUserId = 'demo-user';
          liffToken = 'demo-token';
        }
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        addMessage('bot', '🌱 สวัสดีค่ะ! ยินดีต้อนรับสู่ NetZeroCarbon\n\nพิมพ์ข้อความหรือกดปุ่มด้านล่างเพื่อเริ่มต้นค่ะ');
      } catch (e) {
        console.error('LIFF init error:', e);
        // Fallback to demo mode
        liffUserId = 'demo-user';
        liffToken = 'demo-token';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        addMessage('bot', '🌱 สวัสดีค่ะ! (Demo Mode)\n\nพิมพ์ข้อความเพื่อทดสอบค่ะ');
      }
    }

    // Send message
    async function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      document.getElementById('sendBtn').disabled = true;
      addMessage('user', text);
      showTyping();

      try {
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, userId: liffUserId, token: liffToken }),
        });
        const data = await res.json();
        hideTyping();
        addMessage('bot', data.reply || data.error || 'ไม่สามารถประมวลผลได้');
      } catch (e) {
        hideTyping();
        addMessage('system', 'เกิดข้อผิดพลาด กรุณาลองใหม่');
      }

      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }

    function sendQuick(text) {
      document.getElementById('input').value = text;
      send();
    }

    // Chat UI helpers
    function addMessage(type, text) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    // Enter key to send
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') send();
      });
      initLiff();
    });
  </script>
</body>
</html>
