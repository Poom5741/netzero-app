declared_journeys:
  - id: J0
    name: environment receipt
    steps:
      - verify build fingerprint returns build 8125303
      - verify backend /health responds and reports environment
    expect: fingerprint matches candidate; receipt recorded

  - id: J1
    name: farmer via native LINE OA → LIFF (end-to-end farmer journey)
    entry: real LINE account on Rakazo's computer (LINE desktop/web allowed; this is the accepted release bar — real-device camera pass is waived)
    steps:
      - add friend / open OA netzero-test
      - onboarding / registration via LIFF (name, phone, documents)
      - admin approval gate — LINE blocks photo capture until application is approved; coordinate: complete admin approval in J2 between farmer phases, then return
      - season setup (AWD calendar) via LIFF
      - 4 photo rounds (OB/PJ/RP + close-out) via native photo action → LIFF camera/upload
      - bot replies after each action (single batched reply per replyToken)
      - results summary at season end
    expect: each step's observed state, message content, and LIFF rendering recorded; upload results show pending/flagged states as designed
    known_caveats: GPS 0,0 on evidence photos is a known caveat; fresh post-deploy calendar renders

  - id: J2
    name: admin console review & approval
    entry: https://netzero-frontend.poom-a1d.workers.dev/admin/login
    steps:
      - login (fresh)
      - dashboard: shell, KPIs, navigation
      - farmers list → find the J1 farmer → farmer detail (plots, season inputs, rice variety render)
      - evidence grid → review pending photos from J1 rounds → approve/flag as appropriate for the flow
      - sponsors page → sponsor detail
      - settings page renders
      - logout → confirm session cleared
    expect: approvals unblock the J1 farmer's next phase; wrong-password attempt checked once
    known_caveats: rail shows admin@netzerocarbon.com (cosmetic); pending count may include orphan test links

  - id: J3
    name: sponsor portal (017 UI) — recently fixed F1/F2/F3, regression focus
    entry: https://netzero-frontend.poom-a1d.workers.dev/sponsor/login
    steps:
      - wrong-password attempt → inline Thai error, no navigation
      - correct login → must land on /sponsor and STAY (session gate passes; no bounce)
      - dashboard (ภาพรวม): KPI/summary loads via backend API; province/season filters present; PDPA CS-02 notice visible
      - พื้นที่ (areas): renders; scoped by sponsor areas (สุพรรณบุรี)
      - รายงานและใบรับรอง (reports): EX-2042 row → download → real CSV streams (first line "รายงาน EX-2042 — สรุปคาร์บอนเครดิต")
      - reload /sponsor mid-session → session persists (SameSite=None backend-host cookie)
      - logout → /sponsor now redirects to login; back button does not resurrect the session
    expect: no bounce loop after login; all three pages render; empty states acceptable when data genuinely absent
    context: F1 (JSON login 500), F2 (BACKEND binding + cross-origin login), F3 (same-origin session gate) all resolved 2026-10-05 — treat any recurrence as a defect

  - id: J4
    name: sponsor data scoping (requires J1/J2 to have produced attributable data)
    steps:
      - sponsor sees only farmers/plots within its admin-assigned area
      - CPA codes shown instead of real names (PDPA CS-02)
      - summary numbers reconcile with what admin approved
    expect: any out-of-scope data visible to sponsor = defect (security-relevant)

