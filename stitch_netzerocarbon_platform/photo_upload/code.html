<script>
    document.addEventListener('DOMContentLoaded', () => {
        const captureBtn = document.getElementById('capture-btn');
        const countdownDisplay = document.getElementById('countdown-display');
        const previewCard = document.getElementById('preview-card');
        const closePreviewBtn = document.getElementById('close-preview-btn');
        const levelerLine = document.getElementById('leveler-line');
        const cameraFeed = document.getElementById('camera-feed');
        
        let isCapturing = false;

        // Simulated gyroscope effect on the leveler line
        let angle = 0;
        setInterval(() => {
            if(!isCapturing) {
                angle = Math.sin(Date.now() / 500) * 5; // Slight wobble between -5 and 5 degrees
                levelerLine.style.transform = `rotate(${angle}deg)`;
                
                // If reasonably level, turn indicator green
                if(Math.abs(angle) < 2) {
                   levelerLine.classList.replace('bg-white/50', 'bg-inverse-primary/80');
                } else {
                   levelerLine.classList.replace('bg-inverse-primary/80', 'bg-white/50');
                }
            }
        }, 50);

        captureBtn.addEventListener('click', () => {
            if (isCapturing) return;
            isCapturing = true;
            
            // Hide preview if open
            previewCard.classList.add('translate-y-[150%]', 'opacity-0');
            
            let count = 3;
            countdownDisplay.textContent = count;
            countdownDisplay.classList.remove('opacity-0', 'scale-50');
            countdownDisplay.classList.add('opacity-100', 'scale-100');

            // Haptic feedback simulation (vibrate if supported)
            if (navigator.vibrate) navigator.vibrate(50);

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.textContent = count;
                    // Pulse effect
                    countdownDisplay.classList.remove('scale-100');
                    countdownDisplay.classList.add('scale-110');
                    setTimeout(() => {
                        countdownDisplay.classList.remove('scale-110');
                        countdownDisplay.classList.add('scale-100');
                    }, 100);
                     if (navigator.vibrate) navigator.vibrate(50);
                } else {
                    clearInterval(timer);
                    
                    // The "Snap" effect
                    countdownDisplay.classList.add('opacity-0', 'scale-150');
                    countdownDisplay.classList.remove('opacity-100', 'scale-100');
                    
                    // Flash effect
                    const flash = document.createElement('div');
                    flash.className = 'absolute inset-0 bg-white z-50 opacity-100 transition-opacity duration-300';
                    document.querySelector('.relative.overflow-hidden').appendChild(flash);
                    
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Stronger snap feel
                    
                    setTimeout(() => {
                        flash.classList.remove('opacity-100');
                        flash.classList.add('opacity-0');
                        
                        // Show preview card
                        setTimeout(() => {
                            flash.remove();
                            previewCard.classList.remove('translate-y-[150%]', 'opacity-0');
                            isCapturing = false;
                        }, 300);
                    }, 50);
                }
            }, 1000);
        });

        closePreviewBtn.addEventListener('click', () => {
            previewCard.classList.add('translate-y-[150%]', 'opacity-0');
        });
    });
