name = "netzero-carbon-poc"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "netzero"
database_id = "9f9cb6c3-ef8b-4d10-9457-b92c63f68d64"

# R2 Bucket for photo evidence
[[r2_buckets]]
binding = "R2"
bucket_name = "netzero-photos"

# Workers AI
[ai]
binding = "AI"

# Environment variables
[vars]
ENVIRONMENT = "development"
APP_URL = "https://netzero-carbon-poc.poom-a1d.workers.dev"
